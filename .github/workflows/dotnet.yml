name: .NET
on:
  pull_request:
  push:

jobs:
  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout pull request commits
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Check commit messages
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        invalid=$(git log --format=%s "$BASE_SHA..HEAD" | grep -Ev '^[[:lower:]][[:lower:][:digit:]-]*(\([^()]+\))?!?: [^[:space:]].*$' || true)
        if [ -n "$invalid" ]; then
          echo "::error::Commit messages must follow Conventional Commits: <type>[optional scope][!]: <description>"
          printf '%s\n' "$invalid"
          exit 1
        fi

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.402 # Temporary pin: the 10.0.403 download returns HTTP 409.

    - name: Test
      run: dotnet test Mdu.sln --configuration Release

    - name: Lint Documentation
      run: dotnet run --project Source/Mdu/Mdu.csproj --configuration Release --no-build -- lint ./Docs

  windows-pdf-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.402 # Temporary pin: the 10.0.403 download returns HTTP 409.

    - name: Test PDF selection and generated file handling
      run: dotnet test Source/Mdu.Test/Mdu.Test.csproj --configuration Release --filter "FullyQualifiedName~PdfCommandTest|FullyQualifiedName~SitePdfTest" --blame-hang --blame-hang-timeout 2m

  native-aot-smoke:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.402 # Temporary pin: the 10.0.403 download returns HTTP 409.

    - name: Install Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

    - name: Publish Native AOT executable
      run: dotnet publish Source/Mdu/Mdu.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishAot=true -warnaserror:IL2026,IL2104,IL3050,IL3053 --output "$RUNNER_TEMP/mdu-publish"

    - name: Smoke test native commands
      run: |
        "$RUNNER_TEMP/mdu-publish/mdu" lint ./Docs --format json
        "$RUNNER_TEMP/mdu-publish/mdu" render ./Docs "$RUNNER_TEMP/mdu-site"

        fixture="$RUNNER_TEMP/mdu-fix-smoke"
        mkdir -p "$fixture/Guide/Deep"
        cat > "$fixture/README.md" <<'EOF'
        # Docs

        [Guide](Guide/index.md)
        EOF
        cat > "$fixture/.pages" <<'EOF'
        arrange:
          - README.md
          - Guide
        EOF
        cat > "$fixture/Guide/index.md" <<'EOF'
        ---
        title: Overview
        ---
        # Guide
        EOF
        cat > "$fixture/Guide/Deep/Topic.md" <<'EOF'
        # Topic
        EOF
        "$RUNNER_TEMP/mdu-publish/mdu" fix "$fixture"
        grep -q 'order: 1' "$fixture/Guide/README.md"

  docker-smoke:
    name: Docker smoke (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Source/Mdu/Dockerfile
        platforms: ${{ matrix.platform }}
        load: true
        tags: mdu:smoke

    - name: Smoke test container commands and mounted files
      env:
        PLATFORM: ${{ matrix.platform }}
      shell: bash
      run: |
        docker run --rm --platform "$PLATFORM" mdu:smoke --help
        docker run --rm --platform "$PLATFORM" --entrypoint git mdu:smoke --version

        fixture="$RUNNER_TEMP/mdu-docker-smoke"
        mkdir -p "$fixture/docs" "$fixture/import-docs" "$fixture/import-source/Docs"
        cat > "$fixture/docs/README.md" <<'EOF'
        # Docker smoke test

        This page verifies that MDU can lint and render mounted Markdown files.
        EOF
        git -C "$fixture" init --quiet
        git -C "$fixture" -c user.name="MDU Docker Smoke" -c user.email="mdu@example.com" add docs/README.md
        GIT_AUTHOR_DATE=2026-01-02T10:00:00Z GIT_COMMITTER_DATE=2026-01-02T10:00:00Z \
          git -C "$fixture" -c user.name="MDU Docker Smoke" -c user.email="mdu@example.com" commit --quiet -m "Add Docker smoke page"

        git -C "$fixture/import-source" init --quiet --initial-branch=main
        cat > "$fixture/import-source/Docs/README.md" <<'EOF'
        # Imported through Docker

        This page verifies Git-based repository imports in the container.
        EOF
        git -C "$fixture/import-source" -c user.name="MDU Docker Smoke" -c user.email="mdu@example.com" add Docs/README.md
        git -C "$fixture/import-source" -c user.name="MDU Docker Smoke" -c user.email="mdu@example.com" commit --quiet -m "Add import fixture"
        git clone --quiet --bare "$fixture/import-source" "$fixture/source.git"
        cat > "$fixture/import-docs/README.md" <<'EOF'
        ---
        mdu:
          import:
            source: https://github.com/example/repository/tree/main/Docs
        ---
        EOF

        docker run --rm --platform "$PLATFORM" \
          --volume "$fixture:/work" \
          --workdir /work \
          --user "$(id -u):$(id -g)" \
          mdu:smoke lint docs --format json

        docker run --rm --platform "$PLATFORM" \
          --volume "$fixture:/work" \
          --workdir /work \
          --user "$(id -u):$(id -g)" \
          mdu:smoke render docs site

        test -s "$fixture/site/index.html"
        grep -q 'Docker smoke test' "$fixture/site/index.html"
        grep -q 'datetime="2026-01-02"' "$fixture/site/index.html"
        test "$(stat -c '%u' "$fixture/site/index.html")" = "$(id -u)"

        docker run --rm --platform "$PLATFORM" \
          --volume "$fixture:/work" \
          --workdir /work \
          --user "$(id -u):$(id -g)" \
          --env GIT_CONFIG_COUNT=1 \
          --env GIT_CONFIG_KEY_0=url.file:///work/source.git.insteadOf \
          --env GIT_CONFIG_VALUE_0=https://github.com/example/repository.git \
          mdu:smoke render import-docs imported-site

        test -s "$fixture/imported-site/index.html"
        grep -q 'Imported through Docker' "$fixture/imported-site/index.html"
