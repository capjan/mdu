name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'Source/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The full history dates each page's "Last updated" line.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Render documentation
        run: dotnet run --project Source/Mdu/Mdu.csproj --configuration Release -- render Docs site --editPageRoot https://github.com/capjan/mdu/edit/main/Docs

      - name: Add demo video assets
        run: |
          mkdir -p site/assets
          curl --fail --location --retry 3 --output site/assets/mdu-demoscene.mp4 https://github.com/capjan/mdu/releases/download/v4.6.1/mdu-demoscene.mp4
          curl --fail --location --retry 3 --output site/assets/mdu-demoscene-preview.png https://github.com/capjan/mdu/releases/download/v4.6.1/mdu-demoscene-preview.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # The upstream action still loads Node's deprecated core punycode module.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040
