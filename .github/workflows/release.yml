name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Calculate release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Validate macOS signing configuration
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_NOTARIZATION_KEY" || -z "$APPLE_NOTARIZATION_KEY_ID" || -z "$APPLE_NOTARIZATION_ISSUER_ID" ]]; then
            echo "Configure the Apple signing and notarization secrets and variables described in AGENTS.md." >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Configure the Docker Hub secrets described in AGENTS.md." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"

          if [[ "$latest_tag" == "v2.6.2" ]]; then
            release_tag="$(git cliff --bumped-version --bump major)"
          else
            release_tag="$(git cliff --bumped-version)"
          fi

          if [[ "$release_tag" == "$latest_tag" ]]; then
            echo "No release-worthy Conventional Commits after $latest_tag." >&2
            exit 1
          fi

          package_version="${release_tag#v}"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"
          echo "Package version: $package_version"

      - name: Generate release notes
        env:
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git cliff --tag "$RELEASE_TAG" --strip all "$LATEST_TAG..HEAD" --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  test:
    name: Test
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Mdu.sln --configuration Release

  build-native:
    name: Build ${{ matrix.rid }}
    needs: [prepare-release, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      - name: Publish Native AOT executable
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RID: ${{ matrix.rid }}
        run: dotnet publish Source/Mdu/Mdu.csproj --configuration Release --runtime $env:RID --self-contained true -p:PublishAot=true -warnaserror:IL2026,IL2104,IL3050,IL3053 "-p:Version=$env:PACKAGE_VERSION" --output "$env:RUNNER_TEMP/publish"

      - name: Import Developer ID Application certificate
        if: runner.os == 'macOS'
        id: signing-certificate
        uses: Apple-Actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

      - name: Sign and verify macOS executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          IDENTITIES: ${{ steps.signing-certificate.outputs.identities }}
        run: |
          identity_hash=$(jq -r 'first(.[] | select(.name | startswith("Developer ID Application:")) | .hash) // empty' <<< "$IDENTITIES")
          if [[ -z "$identity_hash" ]]; then
            echo "No valid Developer ID Application identity was imported." >&2
            exit 1
          fi

          codesign --force --options runtime --timestamp --sign "$identity_hash" "$RUNNER_TEMP/publish/mdu"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/publish/mdu"
          "$RUNNER_TEMP/publish/mdu" --help

      - name: Prepare macOS notarization archive
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --keepParent "$RUNNER_TEMP/publish/mdu" "$RUNNER_TEMP/mdu-notarization.zip"

      - name: Notarize macOS executable
        if: runner.os == 'macOS'
        uses: Apple-Actions/notarize@4c7a9c62eed74953bcc47900228429c8e31aa05c # v1
        with:
          path: ${{ runner.temp }}/mdu-notarization.zip
          issuer-id: ${{ vars.APPLE_NOTARIZATION_ISSUER_ID }}
          api-key-id: ${{ vars.APPLE_NOTARIZATION_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
          staple: false

      - name: Prepare executable archive contents
        shell: pwsh
        run: |
          $archiveContents = "$env:RUNNER_TEMP/release-files"
          New-Item -ItemType Directory -Force "$archiveContents/licenses" | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item "$env:RUNNER_TEMP/publish/mdu.exe" $archiveContents
          } else {
            Copy-Item "$env:RUNNER_TEMP/publish/mdu" $archiveContents
          }
          Copy-Item -Path README.md, LICENSE -Destination $archiveContents
          Copy-Item -Path Source/StaticCode.Icons/THIRD-PARTY-NOTICES.md -Destination $archiveContents
          Copy-Item -Path Source/StaticCode.Icons/Res/dashboard-icons.LICENSE -Destination "$archiveContents/licenses"

      - name: Archive Unix executable
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RID: ${{ matrix.rid }}
        run: tar -czf "$env:RUNNER_TEMP/mdu-$env:PACKAGE_VERSION-$env:RID.tar.gz" -C "$env:RUNNER_TEMP/release-files" mdu README.md LICENSE THIRD-PARTY-NOTICES.md licenses

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RID: ${{ matrix.rid }}
        run: Compress-Archive -Path "$env:RUNNER_TEMP/release-files/*" -DestinationPath "$env:RUNNER_TEMP/mdu-$env:PACKAGE_VERSION-$env:RID.zip"

      - name: Upload executable archive
        uses: actions/upload-artifact@v7
        with:
          name: mdu-${{ matrix.rid }}
          path: ${{ runner.temp }}/mdu-${{ needs.prepare-release.outputs.package_version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Pack, publish, and create release
    needs: [prepare-release, test, build-native]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: dotnet pack Source/Mdu/Mdu.csproj --configuration Release --output artifacts/packages -p:Version="$PACKAGE_VERSION"

      - name: Download native executable archives
        uses: actions/download-artifact@v8
        with:
          pattern: mdu-*
          path: artifacts/native
          merge-multiple: true

      - name: Validate native release assets and generate checksums
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          expected=(
            "mdu-$PACKAGE_VERSION-linux-x64.tar.gz"
            "mdu-$PACKAGE_VERSION-win-x64.zip"
            "mdu-$PACKAGE_VERSION-osx-x64.tar.gz"
            "mdu-$PACKAGE_VERSION-osx-arm64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "artifacts/native/$asset" ]]; then
              echo "Missing native release asset: $asset" >&2
              exit 1
            fi
          done
          actual_count=$(find artifacts/native -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} native archives, found $actual_count." >&2
            exit 1
          fi
          (cd artifacts/native && sha256sum "${expected[@]}" > SHA256SUMS)

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Validate NuGet publisher
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Set NUGET_USER to the NuGet.org profile name in repository Actions secrets." >&2
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Create or resume draft GitHub release
        id: github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$is_draft" == "true" ]]; then
              gh release upload "$RELEASE_TAG" artifacts/native/* --clobber
              gh release edit "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes/release-notes.md"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $RELEASE_TAG is already published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Use “Re-run failed jobs” after a partial release so this run reuses its calculated version.
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes/release-notes.md" artifacts/native/*
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish GitHub release
        if: steps.github-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  publish-docker-image:
    name: Build Docker Hub image (${{ matrix.platform }})
    needs: [prepare-release, test, build-native, release]
    if: needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Source/Mdu/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=capjan/mdu,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/capjan/mdu
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.package_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          printf '%s\n' "$IMAGE_DIGEST" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digests-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish-docker:
    name: Publish Docker Hub manifest
    needs: [prepare-release, publish-docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push multi-architecture tags
        env:
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          docker buildx imagetools create \
            --tag "capjan/mdu:$PACKAGE_VERSION" \
            --tag capjan/mdu:latest \
            "capjan/mdu@$(cat /tmp/digests/amd64)" \
            "capjan/mdu@$(cat /tmp/digests/arm64)"
